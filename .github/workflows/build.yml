name: Build Windows EXE
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install pyinstaller
    - run: pyinstaller --onefile --windowed --name "PhoneRescuePro" main.py
    - uses: actions/upload-artifact@v4
      with:
        name: PhoneRescuePro-Windows
        path: dist/PhoneRescuePro.exe
